name: Terraform CI

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the reviewed Terraform plan (true/false)"
        required: true
        default: "false"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Diagnose GitHub OIDC availability
        if: github.event_name != 'pull_request'
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub OIDC request context is available"
          else
            echo "GitHub OIDC request context is missing"
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808486947900:role/GitHubActionsTerraformAssessment
          role-session-name: GitHubActionsTerraformAssessment
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'pull_request'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.apply == 'true'
        run: terraform apply -input=false -auto-approve tfplan
